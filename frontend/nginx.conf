# Nginx do container do frontend (EasyPanel).
# /api e /depoimentos são repassados ao serviço do backend pela rede interna
# do projeto (host = <projeto>_<serviço> no EasyPanel).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    location ^~ /api/ {
        proxy_pass http://croche_backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /depoimentos/ {
        proxy_pass http://croche_backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Raiz = landing page (público)
    location = / {
        try_files /landing.html =404;
    }

    # /admin = sistema de gestão (SPA React)
    location = /admin {
        try_files /index.html =404;
    }

    # Telas públicas da aluna: mesmo SPA, endereço próprio. O App decide a tela
    # pelo caminho — a aluna nunca precisa entrar por "/admin".
    location ~ ^/(portal|agendar)/?$ {
        try_files /index.html =404;
    }

    # Arquivos estáticos: se não existirem, devolve 404 (evita servir index.html como JS/imagem)
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
